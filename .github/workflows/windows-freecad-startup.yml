name: Windows FreeCAD startup regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-startup:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Preserve source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build and install candidate wheel
        shell: pwsh
        run: |
          python -m pip install uv==0.11.17
          $dist = Join-Path $env:RUNNER_TEMP 'startup-dist'
          $venv = Join-Path $env:RUNNER_TEMP 'startup-venv'
          uv build --wheel --sdist --out-dir $dist
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed' }
          uv venv --python 3.12 $venv
          $python = Join-Path $venv 'Scripts/python.exe'
          $wheel = Get-ChildItem -LiteralPath $dist -Filter '*.whl' | Select-Object -First 1
          uv pip install --python $python $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Candidate installation failed' }
          Copy-Item -LiteralPath tests/windows_freecad_startup.py -Destination "$env:RUNNER_TEMP/windows_freecad_startup.py"
      - name: Download pinned official FreeCAD 1.1.3
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'startup-FreeCAD.7z'
          Invoke-WebRequest 'https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Windows-x86_64-py311.7z' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9c6959dc9c4dba64dd818a62447e3dfedb4221d776fb044b239d462f150bcec4') { throw 'Official FreeCAD archive digest mismatch' }
          $tools = Join-Path $env:RUNNER_TEMP 'Startup FreeCAD tools'
          7z x $archive "-o$tools" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'FreeCAD extraction failed' }
          $exe = python -c "import sys; from pathlib import Path; sys.path.insert(0,'tests'); from fea_native_probe import select_bundled_tool; print(select_bundled_tool(Path(sys.argv[1]),'freecadcmd'))" $tools
          if ($LASTEXITCODE -ne 0) { throw 'Official FreeCADCmd selection failed' }
          "STARTUP_FREECADCMD=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Record v0.8.0 baseline reproduction
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'startup-baseline-source'
          git archive v0.8.0 -o "$env:RUNNER_TEMP/startup-baseline.zip"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/startup-baseline.zip" -DestinationPath $baseline
          uv build $baseline --wheel --out-dir "$env:RUNNER_TEMP/startup-baseline-dist"
          if ($LASTEXITCODE -ne 0) { throw 'Baseline build failed' }
          uv venv --python 3.12 "$env:RUNNER_TEMP/startup-baseline-venv"
          $python = "$env:RUNNER_TEMP/startup-baseline-venv/Scripts/python.exe"
          $wheel = Get-ChildItem "$env:RUNNER_TEMP/startup-baseline-dist" -Filter '*.whl' | Select-Object -First 1
          uv pip install --python $python $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Baseline installation failed' }
          Set-Location $env:RUNNER_TEMP
          & $python -I -B windows_freecad_startup.py --freecadcmd $env:STARTUP_FREECADCMD --root "$env:RUNNER_TEMP/startup-evidence/baseline" --extended --baseline
          if ($LASTEXITCODE -ne 0) { throw 'Baseline diagnostic did not finish' }
      - name: Require real MCP startup across both volumes and path spellings
        shell: pwsh
        run: |
          $python = "$env:RUNNER_TEMP/startup-venv/Scripts/python.exe"
          $primary = [IO.Path]::GetPathRoot($env:RUNNER_TEMP).TrimEnd([IO.Path]::DirectorySeparatorChar)
          $second = Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' | Where-Object { $_.FileSystem -eq 'NTFS' -and $_.DeviceID -ne $primary } | Select-Object -First 1
          if (-not $second) {
            $letter = @('D','R','S','T','U','V','W','X','Y','Z') | Where-Object { -not (Test-Path "${_}:\") } | Select-Object -First 1
            if (-not $letter) { throw 'No free startup test-volume drive letter' }
            $vhd = Join-Path $env:RUNNER_TEMP 'startup-second-volume.vhdx'
            if (Test-Path -LiteralPath $vhd) { throw 'Refuse to reuse an existing virtual disk' }
            $diskScript = Join-Path $env:RUNNER_TEMP 'startup-create-volume.txt'
            @"
          create vdisk file="$vhd" maximum=512 type=expandable
          select vdisk file="$vhd"
          attach vdisk
          create partition primary
          format fs=ntfs quick label=STARTUP_TEST
          assign letter=$letter
          exit
          "@ | Set-Content -Encoding ascii -LiteralPath $diskScript
            diskpart /s $diskScript | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'Ephemeral startup test volume creation failed' }
            "STARTUP_OWNED_TEST_VHD=$vhd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $second = Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' | Where-Object { $_.DeviceID -eq "${letter}:" -and $_.FileSystem -eq 'NTFS' } | Select-Object -First 1
          }
          if (-not $second) { throw 'A second fixed NTFS volume is required' }
          $other = Join-Path ($second.DeviceID + '\') ('Startup regression ' + [guid]::NewGuid().ToString('N'))
          "STARTUP_SECOND_EVIDENCE=$other" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Set-Location $env:RUNNER_TEMP
          foreach ($cell in @('ordinary','extended')) {
            $extra = @()
            if ($cell -eq 'extended') { $extra = @('--extended') }
            & $python -I -B windows_freecad_startup.py --freecadcmd $env:STARTUP_FREECADCMD --root "$env:RUNNER_TEMP/startup-evidence/primary-$cell" @extra
            if ($LASTEXITCODE -ne 0) { throw "Primary-volume $cell startup failed" }
            & $python -I -B windows_freecad_startup.py --freecadcmd $env:STARTUP_FREECADCMD --root "$other/$cell" @extra
            if ($LASTEXITCODE -ne 0) { throw "Second-volume $cell startup failed" }
          }
      - name: Preserve second-volume diagnostics
        if: always() && env.STARTUP_SECOND_EVIDENCE != ''
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:STARTUP_SECOND_EVIDENCE) {
            Copy-Item -Recurse -LiteralPath $env:STARTUP_SECOND_EVIDENCE -Destination "$env:RUNNER_TEMP/startup-evidence/second-volume"
          }
      - name: Detach only the startup test disk owned by this job
        if: always() && env.STARTUP_OWNED_TEST_VHD != ''
        shell: pwsh
        run: |
          $expected = Join-Path $env:RUNNER_TEMP 'startup-second-volume.vhdx'
          if ($env:STARTUP_OWNED_TEST_VHD -ne $expected) { throw 'Owned startup disk path mismatch' }
          $script = Join-Path $env:RUNNER_TEMP 'startup-detach-volume.txt'
          @"
          select vdisk file="$expected"
          detach vdisk
          exit
          "@ | Set-Content -Encoding ascii -LiteralPath $script
          diskpart /s $script | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Owned startup test disk detach failed' }
      - name: Upload synthetic startup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-freecad-startup-${{ matrix.runner }}
          path: ${{ runner.temp }}/startup-evidence/
          retention-days: 14
