name: FEA P0 Windows path matrix

on:
  push:
    branches: [codex/text-to-fea-p0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  path-matrix:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Preserve frozen source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare test environment
        shell: pwsh
        run: |
          python -m pip install uv==0.11.21
          uv sync --frozen --group test --python 3.12
          uv run --offline --group test python -m pytest tests/test_fea_path_matrix.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Matrix boundary tests failed' }
      - name: Download and verify official FreeCAD 1.1.3
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'FreeCAD.7z'
          Invoke-WebRequest 'https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Windows-x86_64-py311.7z' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9c6959dc9c4dba64dd818a62447e3dfedb4221d776fb044b239d462f150bcec4') { throw 'Official archive digest mismatch' }
          $tools = Join-Path $env:RUNNER_TEMP 'freecad-tools'
          7z x $archive "-o$tools" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Archive extraction failed' }
          uv run --offline --group test python scripts/fea_p0_config.py --root $tools --output "$env:RUNNER_TEMP/fea-config.json"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned portable tool discovery failed' }
      - name: Run four independent path cells and controls
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'fea-path-matrix'
          uv run --offline --group test python scripts/fea_path_matrix.py --config "$env:RUNNER_TEMP/fea-config.json" --workspace $root
          if ($LASTEXITCODE -ne 0) { throw 'Causal path matrix did not match the recorded hypothesis' }
          $report = Get-Content -LiteralPath (Join-Path $root 'matrix.json') -Raw | ConvertFrom-Json
          if ($report.diagnostic_status -ne 'passed' -or $report.p0_status -ne 'blocked') { throw 'Diagnostics must never mark P0 passed' }
      - name: Upload synthetic matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-fea-path-matrix
          path: ${{ runner.temp }}/fea-path-matrix/
          retention-days: 14
