name: FEA P0 Windows feasibility

on:
  push:
    branches: [codex/text-to-fea-p0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-p0:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Preserve frozen source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare Python test environment
        shell: pwsh
        run: |
          python -m pip install uv==0.11.21
          uv sync --frozen --group test --python 3.12
      - name: Run native Windows process ownership tests
        shell: pwsh
        run: |
          uv run --offline --group test python -m pytest tests/test_analysis_process.py tests/test_analysis_process_windows.py tests/test_fea_native_probe.py tests/test_fea_mesh_quality.py -q --junitxml="$env:RUNNER_TEMP/process-tests.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Process/probe contract tests failed' }
      - name: Prewarm clean-install dependencies for the complete offline suite
        shell: pwsh
        run: |
          $cache = (uv cache dir | Out-String).Trim()
          "UV_CACHE_DIR=$cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $second = Join-Path $env:RUNNER_TEMP 'fea-second-ntfs'
          New-Item -ItemType Directory -Force -Path $second | Out-Null
          "MECH_DESIGN_WINDOWS_SECOND_NTFS_ROOT=$second" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $dist = Join-Path $env:RUNNER_TEMP 'fea-build-prewarm'
          $venv = Join-Path $env:RUNNER_TEMP 'fea-install-prewarm'
          $constraints = Join-Path $env:RUNNER_TEMP 'fea-constraints.txt'
          uv build --wheel --sdist --out-dir $dist
          if ($LASTEXITCODE -ne 0) { throw 'Prewarm build failed' }
          uv export --frozen --group test --format requirements-txt --no-emit-project --no-hashes --output-file $constraints
          uv venv --python 3.12 $venv
          $python = Join-Path $venv 'Scripts/python.exe'
          $wheel = Get-ChildItem -LiteralPath $dist -Filter '*.whl' | Select-Object -First 1
          uv pip install --python $python --constraint $constraints $wheel.FullName pytest==9.1.1 jsonschema==4.26.0
          if ($LASTEXITCODE -ne 0) { throw 'Prewarm install failed' }
      - name: Run complete supported offline suite
        shell: pwsh
        run: |
          $env:UV_OFFLINE = '1'
          uv run --offline --group test python -m pytest -q -rs --junitxml="$env:RUNNER_TEMP/full-offline.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Complete offline suite failed' }
      - name: Download and verify official FreeCAD 1.1.3
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'FreeCAD.7z'
          Invoke-WebRequest 'https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Windows-x86_64-py311.7z' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9c6959dc9c4dba64dd818a62447e3dfedb4221d776fb044b239d462f150bcec4') { throw 'Official archive digest mismatch' }
          $tools = Join-Path $env:RUNNER_TEMP 'freecad-tools'
          7z x $archive "-o$tools" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Archive extraction failed' }
          uv run --offline --group test python scripts/fea_p0_config.py --root $tools --output "$env:RUNNER_TEMP/fea-config.json"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned portable tool discovery failed' }
      - name: Run real Windows synthetic FEA automated subset
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'FEA 空格 evidence'
          uv run --offline --group test python scripts/fea_acceptance.py --config "$env:RUNNER_TEMP/fea-config.json" --workspace $root --phase p0 --automated-only
          if ($LASTEXITCODE -ne 0) { throw 'Native automated FEA feasibility failed' }
          $report = Get-Content -LiteralPath (Join-Path $root 'probe.json') -Raw | ConvertFrom-Json
          if ($report.automated_status -ne 'passed' -or $report.status -ne 'blocked') { throw 'Expected automated PASS with separately unmet interactive/calibration gates' }
      - name: Upload synthetic evidence, including failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-fea-p0-evidence
          path: |
            ${{ runner.temp }}/FEA 空格 evidence/
            ${{ runner.temp }}/process-tests.xml
            ${{ runner.temp }}/full-offline.xml
          retention-days: 14
