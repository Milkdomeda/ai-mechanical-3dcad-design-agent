name: Windows public checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Preserve frozen source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select CPython 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install uv
        shell: pwsh
        run: python -m pip install --disable-pip-version-check uv==0.11.17
      - name: Prepare isolated Windows runner roots
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'ai-mechanical-3dcad-uv-cache'
          $secondVolume = Join-Path $env:RUNNER_TEMP 'ai-mechanical-3dcad-second-ntfs'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          New-Item -ItemType Directory -Force -Path $secondVolume | Out-Null
          "UV_CACHE_DIR=$cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MECH_DESIGN_WINDOWS_SECOND_NTFS_ROOT=$secondVolume" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Resolve the frozen test environment
        shell: pwsh
        run: uv sync --frozen --group test --python 3.12
      - name: Prewarm the pinned build and runtime dependencies
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'public-build-prewarm'
          $venv = Join-Path $env:RUNNER_TEMP 'public-install-prewarm'
          $constraints = Join-Path $env:RUNNER_TEMP 'public-test-constraints.txt'
          uv build --wheel --sdist --out-dir $dist
          uv export --frozen --group test --format requirements-txt --no-emit-project --no-hashes --output-file $constraints
          uv venv --python 3.12 $venv
          $python = Join-Path $venv 'Scripts/python.exe'
          $wheel = Get-ChildItem -LiteralPath $dist -Filter '*.whl' | Select-Object -First 1
          uv pip install --python $python --constraint $constraints $wheel.FullName pytest==9.1.1 jsonschema==4.26.0
      - name: Run the complete non-interactive suite offline
        shell: pwsh
        run: |
          $env:UV_OFFLINE = '1'
          uv run --offline --python 3.12 pytest -q `
            --junitxml=windows-public-offline.xml
          if ($LASTEXITCODE -ne 0) {
            throw 'The public Windows offline suite failed'
          }
          [xml]$junit = Get-Content -LiteralPath windows-public-offline.xml -Raw
          $failed = 0
          $skipped = 0
          foreach ($suite in @($junit.testsuites.testsuite)) {
            $failed += [int]$suite.failures + [int]$suite.errors
            $skipped += [int]$suite.skipped
          }
          # Live database/GUI/Job gates remain opt-in; second-volume tests run.
          $expectedSkipped = 71
          if ($failed -ne 0 -or $skipped -ne $expectedSkipped) {
            throw "Offline suite summary mismatch: failed=$failed skipped=$skipped"
          }
      - name: Build wheel and source distribution offline
        shell: pwsh
        run: |
          $env:UV_OFFLINE = '1'
          uv build --offline --wheel --sdist --out-dir dist
      - name: Run public release boundary checks
        shell: pwsh
        run: |
          $env:UV_OFFLINE = '1'
          uv run --offline --python 3.12 pytest -q `
            --junitxml=windows-public-boundary.xml `
            tests/test_public_release_contract.py `
            tests/test_public_distribution.py `
            tests/test_public_documentation.py `
            tests/test_third_party_licensing.py `
            tests/test_windows_release_evidence.py `
            tests/test_windows_packaging.py
          if ($LASTEXITCODE -ne 0) {
            throw 'The public Windows release-boundary suite failed'
          }
          [xml]$junit = Get-Content -LiteralPath windows-public-boundary.xml -Raw
          $failed = 0
          $skipped = 0
          foreach ($suite in @($junit.testsuites.testsuite)) {
            $failed += [int]$suite.failures + [int]$suite.errors
            $skipped += [int]$suite.skipped
          }
          $expectedSkipped = 3
          if ($failed -ne 0 -or $skipped -ne $expectedSkipped) {
            throw "Release-boundary summary mismatch: failed=$failed skipped=$skipped"
          }
