name: Windows public checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Preserve frozen source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select CPython 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install uv
        shell: pwsh
        run: python -m pip install --disable-pip-version-check uv==0.11.17
      - name: Prepare isolated Windows runner roots
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'ai-mechanical-3dcad-uv-cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $primaryDrive = [IO.Path]::GetPathRoot([IO.Path]::GetTempPath()).TrimEnd([IO.Path]::DirectorySeparatorChar)
          $volume = Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' | Where-Object { $_.FileSystem -eq 'NTFS' -and $_.DeviceID -ne $primaryDrive } | Select-Object -First 1
          if (-not $volume) {
            $letter = @('D','R','S','T','U','V','W','X','Y','Z') | Where-Object { -not (Test-Path "${_}:\") } | Select-Object -First 1
            if (-not $letter) { throw 'No free test-volume drive letter' }
            $vhd = Join-Path $env:RUNNER_TEMP 'fea-second-volume.vhdx'
            if (Test-Path -LiteralPath $vhd) { throw 'Refuse to reuse an existing virtual disk' }
            $diskScript = Join-Path $env:RUNNER_TEMP 'fea-create-test-volume.txt'
            @"
          create vdisk file="$vhd" maximum=512 type=expandable
          select vdisk file="$vhd"
          attach vdisk
          create partition primary
          format fs=ntfs quick label=FEA_TEST
          assign letter=$letter
          exit
          "@ | Set-Content -Encoding ascii -LiteralPath $diskScript
            diskpart /s $diskScript | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'Ephemeral second NTFS creation failed' }
            "FEA_OWNED_TEST_VHD=$vhd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $volume = Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' | Where-Object { $_.DeviceID -eq "${letter}:" -and $_.FileSystem -eq 'NTFS' } | Select-Object -First 1
          }
          if (-not $volume -or $volume.DeviceID -eq $primaryDrive) { throw 'A distinct fixed NTFS test volume is required' }
          $secondVolume = Join-Path ($volume.DeviceID + '\') 'fea-second-ntfs'
          New-Item -ItemType Directory -Force -Path $secondVolume | Out-Null
          "UV_CACHE_DIR=$cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MECH_DESIGN_WINDOWS_SECOND_NTFS_ROOT=$secondVolume" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Resolve the frozen test environment
        shell: pwsh
        run: uv sync --frozen --group test --python 3.12
      - name: Prewarm the pinned build and runtime dependencies
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'public-build-prewarm'
          $venv = Join-Path $env:RUNNER_TEMP 'public-install-prewarm'
          $constraints = Join-Path $env:RUNNER_TEMP 'public-test-constraints.txt'
          uv build --wheel --sdist --out-dir $dist
          uv export --frozen --group test --format requirements-txt --no-emit-project --no-hashes --output-file $constraints
          uv venv --python 3.12 $venv
          $python = Join-Path $venv 'Scripts/python.exe'
          $wheel = Get-ChildItem -LiteralPath $dist -Filter '*.whl' | Select-Object -First 1
          uv pip install --link-mode copy --python $python --constraint $constraints $wheel.FullName pytest==9.1.1 jsonschema==4.26.0
      - name: Run the complete non-interactive suite offline
        shell: pwsh
        run: |
          $env:UV_OFFLINE = '1'
          uv run --offline --python 3.12 pytest -q `
            --junitxml=windows-public-offline.xml
          if ($LASTEXITCODE -ne 0) {
            throw 'The public Windows offline suite failed'
          }
          [xml]$junit = Get-Content -LiteralPath windows-public-offline.xml -Raw
          $failed = 0
          $skipped = 0
          foreach ($suite in @($junit.testsuites.testsuite)) {
            $failed += [int]$suite.failures + [int]$suite.errors
            $skipped += [int]$suite.skipped
          }
          # Live database/GUI gates remain opt-in; second-volume tests run.
          # Exact current opt-in/platform skips, verified against the successful
          # native FEA CI offline JUnit; native FEA gates run separately.
          $expectedSkipped = 74
          if ($failed -ne 0 -or $skipped -ne $expectedSkipped) {
            throw "Offline suite summary mismatch: failed=$failed skipped=$skipped"
          }
      - name: Build wheel and source distribution offline
        shell: pwsh
        run: |
          $env:UV_OFFLINE = '1'
          uv build --offline --wheel --sdist --out-dir dist
      - name: Run public release boundary checks
        shell: pwsh
        run: |
          $env:UV_OFFLINE = '1'
          uv run --offline --python 3.12 pytest -q `
            --junitxml=windows-public-boundary.xml `
            tests/test_public_release_contract.py `
            tests/test_public_distribution.py `
            tests/test_public_documentation.py `
            tests/test_third_party_licensing.py `
            tests/test_windows_release_evidence.py `
            tests/test_windows_packaging.py
          if ($LASTEXITCODE -ne 0) {
            throw 'The public Windows release-boundary suite failed'
          }
          [xml]$junit = Get-Content -LiteralPath windows-public-boundary.xml -Raw
          $failed = 0
          $skipped = 0
          foreach ($suite in @($junit.testsuites.testsuite)) {
            $failed += [int]$suite.failures + [int]$suite.errors
            $skipped += [int]$suite.skipped
          }
          $expectedSkipped = 3
          if ($failed -ne 0 -or $skipped -ne $expectedSkipped) {
            throw "Release-boundary summary mismatch: failed=$failed skipped=$skipped"
          }
      - name: Detach only the virtual disk created by this job
        if: always() && env.FEA_OWNED_TEST_VHD != ''
        shell: pwsh
        run: |
          $vhd = $env:FEA_OWNED_TEST_VHD
          $expected = Join-Path $env:RUNNER_TEMP 'fea-second-volume.vhdx'
          if ($vhd -ne $expected) { throw 'Owned virtual disk path mismatch' }
          $script = Join-Path $env:RUNNER_TEMP 'fea-detach-test-volume.txt'
          @"
          select vdisk file="$vhd"
          detach vdisk
          exit
          "@ | Set-Content -Encoding ascii -LiteralPath $script
          diskpart /s $script | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Owned virtual disk detach failed' }
